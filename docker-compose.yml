services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
  analysis-tests:
    profiles: ["analysis"]
    build:
      context: .
      dockerfile: Dockerfile.analysis
    command: python -m unittest discover -s tests -v
