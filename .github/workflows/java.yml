name: Java risk API
on:
  push:
    paths: ['java-risk/**', '.github/workflows/java.yml']
  pull_request:
    paths: ['java-risk/**', '.github/workflows/java.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mkdir -p java-risk/out && javac -d java-risk/out java-risk/src/risklab/*.java
      - run: java -cp java-risk/out risklab.ExposureTest
