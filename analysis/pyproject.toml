[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risklab"
version = "0.1.0"
description = "Risco cambial, backtesting e previsão de volatilidade com dados BCB"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2"]

[project.scripts]
risklab = "risklab.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
risklab = ["dashboard.html"]
