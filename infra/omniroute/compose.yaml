services:
  router:
    # Avaliação isolada; fixar digest revisado antes de qualquer uso permanente.
    image: diegosouzapw/omniroute@sha256:2c4c755a54f8ce5341bc1856580b71f47a0f16a9afab4a55f84d540810631f68
    restart: "no"
    stop_grace_period: 40s
    environment:
      REQUIRE_API_KEY: "true"
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:?Defina uma senha exclusiva fora do Git}
      DATA_DIR: /app/data
      OMNIROUTE_MEMORY_MB: "2048"
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - router-state:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  router-state:
